[project]
name = "mcp-math"
version = "0.1.0"
description = "Exact calculations over numbers (statistics, percentage change, trend, correlation) as an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kuba" }]
dependencies = [
    "jarvis-mcp-kit @ git+https://github.com/jaknow01/jarvis-mcp-kit.git@v0.1.0",
]

[project.scripts]
mcp-math = "mcp_math.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_math"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
